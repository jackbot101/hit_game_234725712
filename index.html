<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster</title>
<style>
  html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #btn{width:60vmin;height:60vmin;border-radius:50%;border:4px solid #fff;background:transparent;color:#fff;font-size:12vmin;cursor:pointer}
  #btn:disabled{opacity:.3}
  #msg{margin-top:24px;font-size:14px;opacity:.7;text-align:center;padding:0 16px}
  #wrap{position:fixed;left:0;bottom:0;width:300px;height:80px;opacity:0;pointer-events:none}
  #wrap.show{opacity:1;pointer-events:auto;background:#000}
  a{color:#fff}
</style>
</head>
<body>
<button id="btn" disabled>▶</button>
<div id="msg">Lade …</div>
<div id="wrap"><div id="embed"></div></div>
<script src="spotify-connect.js"></script>
<script>
const id = (new URLSearchParams(location.search).get('t') || '').replace('spotify:track:', '').split('?')[0].trim();
const btn = document.getElementById('btn'), msg = document.getElementById('msg');
let api = null, mode = null, ctrl = null;
window.onSpotifyIframeApiReady = a => { api = a; if (mode === 'embed') mkEmbed(); };

function mkEmbed() {
  api.createController(document.getElementById('embed'), { uri: 'spotify:track:' + id, width: 300, height: 80 }, c => {
    ctrl = c; btn.disabled = false;
    msg.innerHTML = 'Tippe zum Abspielen/Pausieren.<br><a href="#" id="fb">Player einblenden</a>';
    document.getElementById('fb').onclick = e => { e.preventDefault(); document.getElementById('wrap').classList.add('show'); };
    c.addListener('playback_update', e => { btn.textContent = e.data.isPaused ? '▶' : '❚❚'; });
  });
  btn.onclick = () => ctrl && ctrl.togglePlay();
}

(async () => {
  await SC.init();
  if (!id) { msg.textContent = 'Kein Song im Link gefunden.'; return; }
  if (SC.on()) {
    mode = 'connect'; let started = false; btn.disabled = false;
    msg.textContent = 'Tippe zum Abspielen. (Spotify-App muss geöffnet sein)';
    btn.onclick = async () => {
      if (!started) {
        const r = await SC.play(id);
        if (r === 'ok') { started = true; btn.textContent = '❚❚'; }
        else msg.textContent = r === 'nodev' ? 'Kein Spotify-Gerät gefunden: Öffne die Spotify-App und starte dort kurz einen Song.' : 'Fehler: ' + r;
      } else btn.textContent = (await SC.toggle()) ? '❚❚' : '▶';
    };
  } else if (SC.configured()) {
    mode = 'login'; btn.disabled = false; btn.textContent = '🔗';
    msg.textContent = 'Einmalig mit Spotify verbinden (Knopf tippen).';
    btn.onclick = SC.login;
  } else { mode = 'embed'; if (api) mkEmbed(); }
})();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
