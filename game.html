<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster</title>
<style>
:root{--bg:#0b1020;--fg:#e8ecff;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#ef4444;--glass:#ffffff12;--line:#ffffff26}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 15% -10%,#6d4aff40,transparent),radial-gradient(800px 500px at 95% 0%,#22d3ee30,transparent),var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:16px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 26px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px #7c5cff55;transition:transform .15s,opacity .15s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.4;box-shadow:none}
.sec{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--fg)}
.sm{padding:6px 14px;font-size:13px}
textarea,input,select{font:inherit;color:var(--fg);padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);width:100%;margin-top:4px}
select option{color:#111}
.box{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px;backdrop-filter:blur(10px)}
#game{max-width:960px;align-items:center;text-align:center}
#info small{opacity:.7}
#tl{display:flex;align-items:center;gap:10px;overflow-x:auto;width:100%;padding:20px 8px;min-height:216px;scroll-snap-type:x proximity}
.card{flex:0 0 132px;height:176px;border-radius:20px;color:#fff;overflow:hidden;scroll-snap-align:center;
  background:linear-gradient(155deg,var(--c1),var(--c2));display:grid;grid-template-rows:64px 1fr;box-shadow:0 10px 24px #0006}
.yr{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;letter-spacing:-.02em;background:#0000002e}
.tx{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 10px;text-align:center}
.tx strong{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tx span{font-size:11px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot{flex:0 0 44px;width:44px;height:44px;padding:0;border-radius:50%;background:var(--glass);border:1px dashed #ffffff66;box-shadow:none;font-size:22px}
.slot:hover{background:var(--acc);transform:scale(1.1)}
.new{animation:pop .7s}
.ok{outline:4px solid var(--ok);outline-offset:2px}
.bad{outline:4px solid var(--bad);outline-offset:2px;animation:pop .7s,shake .5s .7s}
.gone{transition:all .6s;opacity:0;transform:scale(.3) translateY(60px)}
@keyframes pop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#play{width:96px;height:96px;padding:0;font-size:34px;box-shadow:0 0 0 8px #7c5cff22,0 10px 30px #22d3ee55}
#msg{opacity:.85;max-width:560px}
#guess{display:flex;gap:10px;width:100%;max-width:560px}
#judge{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;max-width:560px}
.jr{display:flex;flex-direction:column;gap:6px;align-items:center}
.jb{padding:6px 16px;font-size:14px;background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--fg)}
.jb.sel[data-v="1"]{background:var(--ok);border-color:var(--ok)}
.jb.sel[data-v="0"]{background:var(--bad);border-color:var(--bad)}
#lstat{opacity:.7}
#lstat a{color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
#stats{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:16px}
#stats .panel{width:100%;max-width:680px;padding:16px;text-align:left}
#stats h2{margin-bottom:8px}
#stats table{width:100%;border-collapse:collapse}
#stats th,#stats td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.bar{position:relative;height:22px;min-width:90px;background:var(--glass);border-radius:11px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar b{position:relative;font-size:12px;padding-left:8px;line-height:22px}
#wrap{position:fixed;left:0;bottom:0;width:300px;height:80px;opacity:0;pointer-events:none}
#wrap.show{opacity:1;pointer-events:auto;z-index:9;background:#000}
.hide{display:none!important}
</style>
</head>
<body>
<div id="setup" class="box panel">
  <h1>🎵 Hitster</h1>
  <label>Modus
    <select id="mode"><option value="multi">Mehrspieler (Zeitleiste)</option><option value="solo">Solo (Punkte)</option></select></label>
  <label id="pl">Spieler (einer pro Zeile, Solo: erste Zeile)<textarea id="names" rows="3">Spieler 1
Spieler 2</textarea></label>
  <label id="gl">Karten zum Sieg<input id="goal" type="number" value="10" min="3"></label>
  <div id="load" class="hide">songs.json nicht gefunden – bitte Datei wählen:<input type="file" id="file" accept=".json"></div>
  <button class="sec" type="button" onclick="showStats()">🏆 Bestenliste &amp; Statistik</button>
  <small id="lstat"></small>
  <div class="row"><button class="sec sm" id="lexp" type="button">⬇ Lernstand exportieren</button><button class="sec sm" id="limp" type="button">⬆ importieren</button><input type="file" id="lfile" accept=".json" class="hide"></div>
  <button id="sc" class="sec" type="button"></button>
  <button class="pl sec" type="button">🔑 Spotify-Player ein-/ausblenden (zum Einloggen)</button>
  <button id="go" disabled>Los geht's</button>
</div>

<div id="game" class="box hide">
  <div id="info"></div>
  <div id="tl"></div>
  <div id="msg"></div>
  <div id="guess" class="hide"><input id="ga" placeholder="Interpret (optional)"><input id="gt" placeholder="Titel (optional)"></div>
  <div id="judge" class="hide"></div>
  <button id="play" class="hide">▶</button>
  <button id="main"></button>
  <button id="buy" class="sec hide">🎟️ 3 Token → Gratis-Karte</button>
</div>
<div id="stats" class="hide"></div>
<div id="wrap"><div id="embed"></div></div>

<script src="spotify-connect.js"></script>
<script>
try { SC; } catch (e) {
  window.SC = { init: () => Promise.resolve(), configured: () => false, on: () => false,
    login() {}, play: () => Promise.resolve('err'), pause() {}, toggle: () => Promise.resolve(false), missing: true };
}
</script>
<script>
let songs = [], ctrl = null, apiReady = null, G;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec = s => Math.floor(s.year / 10);

function setSongs(d) { songs = d; $('load').classList.add('hide'); $('go').disabled = false; }
fetch('songs.json').then(r => r.json()).then(setSongs).catch(() => $('load').classList.remove('hide'));
$('file').onchange = e => e.target.files[0].text().then(t => setSongs(JSON.parse(t)));
$('mode').onchange = () => {
  const solo = $('mode').value === 'solo';
  $('gl').classList.toggle('hide', solo);
};
window.onSpotifyIframeApiReady = api => { apiReady = api; };

function updSC() {
  const b = $('sc');
  if (SC.missing) { b.textContent = '⚠️ spotify-connect.js wurde nicht geladen (Datei fehlt oder enthält einen Fehler)'; return; }
  if (!SC.configured()) { b.classList.add('hide'); return; }
  b.textContent = SC.on() ? '✓ Mit Spotify verbunden (App wird ferngesteuert)' : '🔗 Mit Spotify verbinden (volle Songs, empfohlen)';
  b.onclick = SC.on() ? null : SC.login;
}
SC.init().then(updSC);
function startSong(id) {
  if (SC.on()) {
    $('play').textContent = '❚❚';
    SC.play(id).then(r => { if (r !== 'ok') $('msg').textContent = r === 'nodev'
      ? 'Kein Spotify-Gerät gefunden: Öffne die Spotify-App und starte dort kurz einen Song.' : 'Spotify-Fehler: ' + r; });
  } else ensure('spotify:track:' + id, true);
}
const pauseSong = () => SC.on() ? SC.pause() : ctrl && ctrl.pause();
const toggleSong = () => SC.on() ? SC.toggle().then(p => { $('play').textContent = p ? '❚❚' : '▶'; }) : ctrl && ctrl.togglePlay();
let making = false;
function ensure(uri, auto) {
  if (ctrl) { if (auto) { ctrl.loadUri(uri); ctrl.play(); } return; }
  if (!apiReady || making) return;
  making = true;
  apiReady.createController($('embed'), { uri, width: 300, height: 80 }, c => {
    ctrl = c;
    c.addListener('playback_update', e => { $('play').textContent = e.data.isPaused ? '▶' : '❚❚'; });
    if (auto) c.play();
  });
}
document.querySelectorAll('.pl').forEach(b => b.onclick = () => {
  if (!ctrl && songs.length) ensure('spotify:track:' + songs[0].id, false);
  $('wrap').classList.toggle('show');
});

// Tippfehler-tolerante Prüfung
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\(.*?\)|\[.*?\]/g, '').replace(/\b(feat|ft)\b.*$/, '').replace(/&/g, 'and')
  .replace(/^the /, '').replace(/[^a-z0-9]+/g, '');
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// Lernende Bewertung: Jede Entscheidung wird gespeichert (nur in diesem Browser).
// - Gleiche Eingabe bei gleichem Song wird künftig wie von dir entschieden bewertet.
// - Die erlaubte Abweichung (Toleranz) wird aus deinen bisherigen Entscheidungen berechnet.
let LOG = [], thr = 0.15; const MEM = {};
try { LOG = JSON.parse(localStorage.getItem('hitster_log') || '[]'); } catch (e) {}
function ratio(g, cands) {
  g = norm(g); if (!g) return 1;
  return Math.min(...cands.map(c => { c = norm(c); return c ? lev(g, c) / c.length : 1; }));
}
function learn() {
  const cs = LOG.filter(l => l.r > 0);          // nur Fälle mit Abweichung
  if (cs.length < 6) return 0.15;               // zu wenig Daten: strenger Standard
  let best = 0, bestErr = Infinity;
  for (let t = 0; t <= 0.4001; t += 0.025) {    // kleinste Toleranz mit den wenigsten Fehlentscheidungen
    const err = cs.filter(l => (l.r <= t) !== l.ok).length;
    if (err < bestErr) { bestErr = err; best = t; }
  }
  return best;
}
function judgeAuto(f, g) {
  const gn = norm(g); if (!gn) return { ok: false, r: 1 };
  const cands = f === 'a' ? [G.song.artist, ...G.song.artist.split(', ')] : [G.song.title];
  const r = ratio(g, cands), key = G.song.id + '|' + f + '|' + gn;
  return key in MEM ? { ok: MEM[key], r, mem: true } : { ok: r <= thr, r };
}
function saveLog(f, ok) {
  const g = norm(f === 'a' ? G.guess.a : G.guess.t); if (!g) return;
  LOG.push({ id: G.song.id, f, g, r: +G.auto[f].r.toFixed(3), ok });
  MEM[G.song.id + '|' + f + '|' + g] = ok;
  if (LOG.length > 3000) LOG.shift();
  try { localStorage.setItem('hitster_log', JSON.stringify(LOG)); } catch (e) {}
  thr = learn(); updStat();
}
function updStat() {
  $('lstat').innerHTML = `Bewertungs-Lernstand: ${LOG.length} Entscheidungen, erlaubte Abweichung ${Math.round(thr * 100)} % · <a href="#" id="lreset">zurücksetzen</a>`;
}
LOG.forEach(l => { MEM[l.id + '|' + l.f + '|' + l.g] = l.ok; }); thr = learn(); updStat();
document.addEventListener('click', e => {
  if (e.target.id === 'lreset') { e.preventDefault(); LOG = []; for (const k in MEM) delete MEM[k];
    try { localStorage.removeItem('hitster_log'); } catch (x) {} thr = learn(); updStat(); }
});
$('judge').onclick = e => {
  const b = e.target.closest('.jb'); if (!b) return;
  G.judge[b.parentElement.dataset.f] = b.dataset.v === '1';
  b.parentElement.querySelectorAll('.jb').forEach(x => x.classList.toggle('sel', x === b));
};

// Lernstand sichern / übertragen
$('lexp').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(LOG)], { type: 'application/json' }));
  a.download = 'hitster-lernstand.json'; a.click(); };
$('limp').onclick = () => $('lfile').click();
$('lfile').onchange = e => e.target.files[0].text().then(t => {
  try {
    const m = new Map(); [...LOG, ...JSON.parse(t)].forEach(l => m.set(l.id + '|' + l.f + '|' + l.g, l));
    LOG = [...m.values()]; LOG.forEach(l => { MEM[l.id + '|' + l.f + '|' + l.g] = l.ok; });
    localStorage.setItem('hitster_log', JSON.stringify(LOG)); thr = learn(); updStat();
  } catch (x) { alert('Datei konnte nicht gelesen werden.'); }
});

// STATS-START
let EV = [], SCORES = [];
try { EV = JSON.parse(localStorage.getItem('hitster_ev') || '[]'); SCORES = JSON.parse(localStorage.getItem('hitster_scores') || '[]'); } catch (e) {}
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function saveEv(ja, jt) {
  EV.push({ id: G.song.id, y: G.song.year, g: G.song.genres || [], ok: G.rev.ok,
    a: G.guess.a ? ja : null, t: G.guess.t ? jt : null, n: G.ps[G.cur].n, ts: Date.now() });
  if (EV.length > 20000) EV.shift(); store('hitster_ev', EV);
}
function saveGame() {
  const p = G.ps[G.cur];
  SCORES.push(G.solo ? { m: 's', n: p.n, pts: p.pts, ts: Date.now() } : { m: 'm', ps: G.ps.map(x => x.n), w: p.n, ts: Date.now() });
  store('hitster_scores', SCORES);
}
function showStats(pl = '') {
  const ev = EV.filter(e => !pl || e.n === pl);
  const pct = (a, n) => n ? Math.round(100 * a / n) : null;
  const agg = list => { const r = { n: 0, ok: 0, an: 0, a: 0, tn: 0, t: 0 };
    list.forEach(e => { r.n++; r.ok += e.ok ? 1 : 0; if (e.a !== null) { r.an++; r.a += e.a ? 1 : 0; } if (e.t !== null) { r.tn++; r.t += e.t ? 1 : 0; } });
    return r; };
  const row = (label, r) => `<tr><td>${esc(label)}</td><td>${r.n}</td><td><div class="bar"><i style="width:${pct(r.ok, r.n)}%"></i><b>${pct(r.ok, r.n)} %</b></div></td>` +
    `<td>${r.an ? pct(r.a, r.an) + ' %' : '–'}</td><td>${r.tn ? pct(r.t, r.tn) + ' %' : '–'}</td></tr>`;
  const table = (c, rows) => rows.length ? `<table><tr><th>${c}</th><th>Runden</th><th>Einordnung</th><th>Interpret</th><th>Titel</th></tr>${rows.join('')}</table>` : '<small>Noch keine Daten.</small>';
  const dec = {}, gen = {};
  ev.forEach(e => { const d = Math.floor(e.y / 10) * 10; (dec[d] = dec[d] || []).push(e);
    (e.g && e.g.length ? e.g : ['(ohne Genre)']).forEach(g => (gen[g] = gen[g] || []).push(e)); });
  const decRows = Object.keys(dec).sort().map(d => row(d + 'er', agg(dec[d])));
  let ge = Object.entries(gen).sort((a, b) => b[1].length - a[1].length);
  const big = ge.filter(x => x[1].length >= 3); if (big.length) ge = big;
  const genRows = ge.slice(0, 15).map(([g, l]) => row(g, agg(l)));
  const solo = SCORES.filter(x => x.m === 's').sort((a, b) => b.pts - a.pts).slice(0, 10)
    .map(x => `<li><b>${x.pts}</b> Punkte – ${esc(x.n)} <small>(${new Date(x.ts).toLocaleDateString('de-DE')})</small></li>`).join('');
  const w = {}, gm = {};
  SCORES.filter(x => x.m === 'm').forEach(x => { x.ps.forEach(n => gm[n] = (gm[n] || 0) + 1); w[x.w] = (w[x.w] || 0) + 1; });
  const multi = Object.keys(gm).sort((a, b) => (w[b] || 0) - (w[a] || 0)).map(n => `<li>${esc(n)}: <b>${w[n] || 0}</b> Siege aus ${gm[n]} Spielen</li>`).join('');
  const names = [...new Set(EV.map(e => e.n))];
  $('stats').innerHTML = `<h1>🏆 Bestenliste &amp; Statistik</h1>` +
    `<div class="panel"><h2>Solo-Bestenliste</h2>${solo ? `<ol>${solo}</ol>` : '<small>Noch kein Solo-Spiel beendet.</small>'}</div>` +
    `<div class="panel"><h2>Mehrspieler</h2>${multi ? `<ul>${multi}</ul>` : '<small>Noch kein Spiel beendet.</small>'}</div>` +
    `<div class="panel"><h2>Wie gut bist du?</h2><label>Spieler <select onchange="showStats(this.value)"><option value="">Alle</option>` +
    names.map(n => `<option ${n === pl ? 'selected' : ''}>${esc(n)}</option>`).join('') + `</select></label>` +
    `<h2 style="margin-top:14px">Nach Jahrzehnt</h2>${table('Jahrzehnt', decRows)}` +
    `<h2 style="margin-top:14px">Nach Genre</h2>${table('Genre', genRows)}` +
    `<small>Einordnung = Anteil richtig platzierter Songs. Interpret/Titel zählen nur Runden mit Eingabe.</small></div>` +
    `<div class="row"><button onclick="$('stats').classList.add('hide')">✕ Schließen</button>` +
    `<button class="sec" onclick="if(confirm('Statistik und Bestenliste wirklich löschen?')){EV=[];SCORES=[];store('hitster_ev',EV);store('hitster_scores',SCORES);showStats()}">Alles löschen</button></div>`;
  $('stats').classList.remove('hide');
}
// STATS-END

// Song-Auswahl: unbenutzt, bevorzugt Jahre, die noch in keiner Zeitleiste liegen,
// und gewichtet gegen Jahrzehnte, die schon oft dran waren.
function pick() {
  let pool = songs.filter(s => !G.used.has(s.id));
  if (!pool.length) { G.used.clear(); pool = songs.slice(); }
  const have = new Set(G.ps.flatMap(p => p.tl.map(s => s.year)));
  const fresh = pool.filter(s => !have.has(s.year));
  if (fresh.length) pool = fresh;
  const cnt = {};
  songs.forEach(s => { if (G.used.has(s.id)) cnt[dec(s)] = (cnt[dec(s)] || 0) + 1; });
  const w = pool.map(s => 1 / (1 + (cnt[dec(s)] || 0)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while (i < pool.length - 1 && (r -= w[i]) > 0) i++;
  G.used.add(pool[i].id);
  return pool[i];
}

$('go').onclick = () => {
  const solo = $('mode').value === 'solo';
  const names = $('names').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, solo ? 1 : 99);
  if (!names.length) return;
  G = { solo, goal: +$('goal').value || 10, cur: 0, used: new Set(), round: 0, rounds: 15, st: 'ready',
        ps: names.map(n => ({ n, tl: [], pts: 0, streak: 0, tok: 0 })) };
  G.ps.forEach(p => p.tl.push(pick()));
  $('setup').classList.add('hide'); $('game').classList.remove('hide');
  render();
};

// Farbe je Jahrzehnt
const PAL = { 1950: ['#dc2626', '#ea580c'], 1960: ['#ea580c', '#d97706'], 1970: ['#ca8a04', '#65a30d'],
  1980: ['#16a34a', '#0d9488'], 1990: ['#0891b2', '#2563eb'], 2000: ['#4f46e5', '#7c3aed'],
  2010: ['#9333ea', '#db2777'], 2020: ['#db2777', '#e11d48'] };
const pal = y => PAL[Math.min(2020, Math.max(1950, Math.floor(y / 10) * 10))];
const cardHTML = (s, cls = '') => { const [c1, c2] = pal(s.year);
  return `<div class="card ${cls}" style="--c1:${c1};--c2:${c2}"><div class="yr">${s.year}</div>` +
    `<div class="tx"><strong>${esc(s.title)}</strong><span>${esc(s.artist)}</span></div></div>`; };

function render() {
  const p = G.ps[G.cur], rev = G.st === 'reveal' ? G.rev : null;
  $('info').innerHTML = G.solo
    ? `<h2>Runde ${G.round + 1}/${G.rounds} · ${p.pts} Punkte · Serie ${p.streak}</h2>`
    : `<h2>${esc(p.n)} ist dran</h2><small>${G.ps.map(q => `${esc(q.n)}: ${q.tl.length}/${G.goal} 🎟️${q.tok}`).join(' · ')}</small>`;
  let h = '';
  for (let i = 0; i <= p.tl.length; i++) {
    if (G.st === 'place') h += `<button class="slot" data-i="${i}">+</button>`;
    if (rev && rev.idx === i) h += cardHTML(G.song, 'new ' + (rev.ok ? 'ok' : 'bad'));
    if (i < p.tl.length) h += cardHTML(p.tl[i]);
  }
  $('tl').innerHTML = h;
  $('play').classList.toggle('hide', G.st !== 'place' && G.st !== 'reveal');
  const m = $('main');
  m.classList.toggle('hide', G.st === 'place');
  m.textContent = G.st === 'ready' ? '▶ Song starten' : 'Weiter';
  $('msg').textContent = G.st === 'ready' ? 'Bereit? Dann Song starten.'
    : G.st === 'place' ? 'Wo gehört der Song hin? Optional Interpret/Titel eintippen, dann auf ein + tippen. (Kein Ton? ▶ drücken)'
    : (rev.ok ? '✅ Richtig! ' : '❌ Falsch. ') + `${G.song.artist} – ${G.song.title} (${G.song.year})`;
  $('guess').classList.toggle('hide', G.st !== 'place');
  $('judge').classList.toggle('hide', G.st !== 'reveal');
  $('buy').classList.toggle('hide', !(G.st === 'ready' && !G.solo && p.tok >= 3));
  if (rev) {
    const row = (f, label, g, au) => `<div class="jr"><span>${label}: <b>${esc(g) || '–'}</b> <small>${g ? Math.round(au.r * 100) + ' % Abweichung' + (au.mem ? ' · gelernt' : '') : 'keine Eingabe'}</small></span>` +
      `<span data-f="${f}"><button class="jb ${G.judge[f] ? 'sel' : ''}" data-v="1">✔ richtig</button> <button class="jb ${G.judge[f] ? '' : 'sel'}" data-v="0">✘ falsch</button></span></div>`;
    $('judge').innerHTML = `<div>Richtig wäre: <b>${esc(G.song.artist)}</b> / <b>${esc(G.song.title)}</b></div>` +
      row('a', 'Interpret', G.guess.a, G.auto.a) + row('t', 'Titel', G.guess.t, G.auto.t);
  }
  const n = document.querySelector('.new');
  if (n) {
    n.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    if (!rev.ok) setTimeout(() => n.classList.add('gone'), 2000);
  }
}

$('tl').onclick = e => {
  const b = e.target.closest('.slot');
  if (!b || G.st !== 'place') return;
  const idx = +b.dataset.i, p = G.ps[G.cur], t = p.tl, y = G.song.year;
  const ok = (idx === 0 || t[idx - 1].year <= y) && (idx === t.length || y <= t[idx].year);
  if (G.solo) { if (ok) { p.pts += 100 + 25 * p.streak; p.streak++; } else p.streak = 0; }
  G.guess = { a: $('ga').value.trim(), t: $('gt').value.trim() };
  G.auto = { a: judgeAuto('a', G.guess.a), t: judgeAuto('t', G.guess.t) };
  G.judge = { a: G.auto.a.ok, t: G.auto.t.ok };
  G.rev = { idx, ok }; G.st = 'reveal'; render();
};

$('play').onclick = toggleSong;

$('buy').onclick = () => {
  const p = G.ps[G.cur]; p.tok -= 3;
  const s = pick(), i = p.tl.findIndex(x => x.year > s.year);
  p.tl.splice(i < 0 ? p.tl.length : i, 0, s);
  if (p.tl.length >= G.goal) return end(`${esc(p.n)} gewinnt!`);
  render(); $('msg').textContent = `Gratis-Karte: ${s.artist} – ${s.title} (${s.year})`;
};

function end(txt) {
  saveGame();
  $('game').innerHTML = `<h1>🏆 ${txt}</h1><button onclick="location.reload()">Nochmal spielen</button> <button class="sec" onclick="showStats()">Bestenliste &amp; Statistik</button>`;
}

$('main').onclick = () => {
  if (G.st === 'ready') {
    if (!SC.on() && !ctrl && !apiReady) { $('msg').textContent = 'Spotify lädt noch – gleich nochmal tippen.'; return; }
    G.song = pick(); $('ga').value = $('gt').value = ''; startSong(G.song.id); G.st = 'place'; render();
  } else if (G.st === 'reveal') {
    const p = G.ps[G.cur];
    pauseSong();
    const ja = G.judge.a, jt = G.judge.t;
    saveLog('a', ja); saveLog('t', jt); saveEv(ja, jt);
    if (G.solo) p.pts += (ja ? 25 : 0) + (jt ? 25 : 0); else if (ja && jt) p.tok++;
    if (G.rev.ok) p.tl.splice(G.rev.idx, 0, G.song);
    if (G.solo) {
      if (++G.round >= G.rounds) return end(`${p.pts} Punkte`);
    } else {
      if (G.rev.ok && p.tl.length >= G.goal) return end(`${esc(p.n)} gewinnt!`);
      G.cur = (G.cur + 1) % G.ps.length;
    }
    G.st = 'ready'; render();
  }
};
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
